    return;
  }

  const total=sum(R,x=>x.min), studied=days.filter(d=>d.total>0).length, goalDays=days.filter(d=>d.total>=S.goalMin).length;
  const hh=Math.floor(total/60),mm=Math.round(total%60);
  const tile=(a,b,u)=>h('div',{class:'tile'},h('div',{class:'a',text:a}),h('div',{class:'b'},b,u?h('small',{text:u}):null));
  const hero=h('div',{class:'card hero'},
    h('div',{class:'cap',text:RANGES.find(r=>r.k===S.range).cap+'の学習時間'}),
    h('div',{class:'big'},hh>0?[String(hh),h('small',{text:'時間'})]:null,String(mm),h('small',{text:'分'})),
    h('div',{class:'tiles'},
      tile('勉強した日',studied+' / '+N,'日'),
      tile('1日の平均',String(Math.round(total/N)),'分'),
      tile('目標を超えた日',String(goalDays),'日'),
      tile('連続で勉強中',String(streak()),'日')));

  const E=R.filter(x=>x.eff!=null);
  const LB=bucketize(E,LEN,x=>x.min), TB=bucketize(E,TOD,x=>new Date(x.start).getHours());
  const ins=makeInsights(R,E,LB,TB,from,today0);
  const insCard=h('div',{class:'card'},h('h2',{text:'記録から見えること'}),
    h('ul',{class:'ins'},ins.map(i=>h('li',{},h('span',{class:'tag',text:i.tag}),h('span',{text:i.text})))));

  const present=SUBJECTS.filter(sj=>days.some(d=>d.by[sj.id]>0));
  const dbox=h('div',{class:'chart'});
  reg(dbox,b=>drawDaily(b,days,S.goalMin,from));
  const table=h('details',{class:'tv'},h('summary',{text:'表で見る'}),h('div',{class:'tscroll'},
    h('table',{},h('thead',{},h('tr',{},h('th',{text:'日付'}),present.map(sj=>h('th',{text:tl(sj)})),h('th',{text:'合計'}))),
      h('tbody',{},days.slice().reverse().map(d=>h('tr',{},h('td',{text:dateLong(d.ms)}),present.map(sj=>h('td',{text:d.by[sj.id]?fmtMin(d.by[sj.id]):'–'})),h('td',{text:d.total?fmtMin(d.total):'–'})))))));
  const daily=h('div',{class:'card'},dbox,table);

  const maxMin=Math.max(...SUBJECTS.map(sj=>sum(R.filter(x=>x.subject===sj.id),x=>x.min)));
  const share=h('ul',{class:'share'},SUBJECTS.map(sj=>{
    const L=R.filter(x=>x.subject===sj.id),mn=sum(L,x=>x.min);
    if(!mn) return null;
    const by={};L.forEach(x=>{if(x.amount>0){by[x.unit]=(by[x.unit]||{a:0,m:0});by[x.unit].a+=x.amount;by[x.unit].m+=x.min;}});
    const am=Object.keys(by).map(u=>fmtNum(by[u].a)+u+'(1時間あたり '+fmtNum(by[u].a/by[u].m*60)+u+')');
    return h('li',{},h('div',{class:'hd'},h('span',{class:'nm'},h('i',{style:'background:'+sj.c}),tl(sj)),h('span',{class:'tm',text:fmtMin(mn)+'・'+Math.round(mn/total*100)+'%'})),
      h('div',{class:'bar'},h('b',{style:'width:'+(mn/maxMin*100)+'%;background:'+sj.c})),
      am.length?h('div',{class:'amt',text:'やった量:'+am.join('、')}):null);
  }));
  const subjCard=h('div',{class:'card'},h('h2',{text:'何を、どのくらい'}),share);

  const effBox=h('div',{class:'chart'});
  const nEffDays=days.filter(d=>d.eff!=null).length;
  let effCard;
  if(nEffDays>=2){
    reg(effBox,b=>drawEff(b,days,from));
    effCard=h('div',{class:'card'},h('h2',{text:'効率の推移'}),h('p',{class:'sub',text:'1日ごとの効率指数。100が「いつもの自分」です。'}),effBox);
  }else{
    effCard=h('div',{class:'card'},h('h2',{text:'効率の推移'}),h('p',{class:'empty',text:'量を入れた記録が2日分以上あると、ここに推移が出ます。(同じ教科・同じ単位で3回以上の記録も必要です)'}));
  }
  const lbox=h('div',{class:'chart'}),tbox=h('div',{class:'chart'});
  reg(lbox,b=>drawDiv(b,LB.bk,LB.best,'取り組んだ長さ'));
  reg(tbox,b=>drawDiv(b,TB.bk,TB.best,'始めた時間帯'));
  const lenCard=h('div',{class:'card'},h('h2',{text:'どのくらい続けるといい?'}),h('p',{class:'sub',text:'1回の長さ(分)ごとの、いつもとの差。'}),lbox);
  const todCard=h('div',{class:'card'},h('h2',{text:'いつ始めるといい?'}),h('p',{class:'sub',text:'始めた時間帯ごとの、いつもとの差。'}),tbox);
  const how=h('p',{class:'note',style:'padding:2px 4px',text:'効率指数は、タスクごとの「これまでの平均ペース(時間あたりの量)」を100として、その記録のペースを比べた数字です。量を入れた記録だけが対象です。'});

  root.append(h('div',{class:'sgrid'},hero,insCard,streakCard(),daily,heatCard(),h('div',{class:'sgrid two'},subjCard,effCard),h('div',{class:'sgrid two'},lenCard,todCard),weekdayCard(),gapCard(),limitCard(),how));
  drawAll();
}

/* ---------- routing ---------- */
function setTab(t){
  S.tab=t; closeSheet();
  ['timer','tasks','log','stats','game'].forEach(k=>{
    $('#p-'+k).hidden=k!==t;
    $('#tab-'+k).setAttribute('aria-selected',String(k===t));
  });
  hideTip();
  if(t==='timer') renderTimer(); else if(t==='tasks') renderTasks(); else if(t==='log') renderLog(); else if(t==='game') ManabiGame.render($('#p-game')); else renderStats();
  try{window.scrollTo(0,0);}catch(e){}
}
document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

/* ---------- ticking ---------- */
function tick(){updateTimerUI();checkNotices();}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'){tick(); if(S.timer.status==='running') lockScreen();}
});
let rz=0;
if(window.ResizeObserver){
  new ResizeObserver(()=>{cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{if(S.tab==='stats') drawAll(); else if(S.tab==='log') taDrawAll();});}).observe($('.wrap'));
}

/* ---------- 言語 ---------- */
function applyLang(l,fromSettings){
  I18N.setLang(l);
  $('#todayLabel').textContent=dateLong(Date.now());
  updateGamePill(); renderBanner(); setTab(S.tab);
  if(fromSettings) openManage();
}
function langPicker(){
  const wrap=h('div',{class:'sheetwrap','data-notr':'1',role:'dialog','aria-modal':'true','aria-label':'Language / 言語',style:'z-index:90'},
    h('div',{class:'scrim',style:'background:rgba(10,16,15,.7)'}),
    h('div',{class:'sheetp',style:'top:50%;bottom:auto;transform:translateY(-50%);border-radius:20px;max-width:420px;margin:0 auto;left:16px;right:16px'},
      h('div',{style:'font:700 20px var(--f-disp);text-align:center;margin-bottom:6px',text:'Language / 言語'}),
      h('p',{class:'note',style:'text-align:center;margin-bottom:16px',text:'言語をえらんでください / Choose your language'}),
      h('div',{class:'rbtns'},
        h('button',{type:'button',class:'btn pri',on:{click:()=>pick('ja')}},'日本語'),
        h('button',{type:'button',class:'btn pri',on:{click:()=>pick('en')}},'English')),
      h('p',{class:'note',style:'text-align:center;margin-top:12px',text:'あとから「タイマー」の「せってい」で変えられます / You can change it later in Timer → Settings'})));
  function pick(l){wrap.remove();applyLang(l,false);}
  document.body.append(wrap);
}

/* ---------- boot ---------- */
(function(){
  const d=new Date();
  $('#todayLabel').textContent=dateLong(d.getTime());
  renderBanner();
  updateGamePill();
  if(S.timer.status!=='idle'){FL.subj=groupKeyOf(S.timer.subject);FL.view='timer';}
  if(S.timer.status==='running') lockScreen();
  setTab('timer');
  if(/[?&]act=random/.test(location.search)) startRandomPending();
  if(!I18N.saved()) langPicker();
})();
})();
</script>
